name: Feature request
description: Suggest an idea or improvement.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in and what's frustrating about it today.
      placeholder: I generate dozens of variations and it's hard to see which settings changed…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like PromptVault to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: PromptVault is local-first. Features that send data elsewhere must be optional and clearly disclosed.
      options:
        - label: This idea works without sending my prompts or images to an external service, or I've described how it would be opt-in.
